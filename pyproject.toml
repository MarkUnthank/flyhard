[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyhard"
version = "0.1.0"
description = "A connectome-based fly learning to physically operate a tiny car"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy>=2,<3", "torch>=2.8,<3", "pyarrow>=20,<26", "scipy>=1.15,<2"]

[project.optional-dependencies]
body = ["flygym @ git+https://github.com/NeLy-EPFL/flygym.git@38c8ec61034cd59bc5ba0de20688d4a3c0000d60"]
video = ["cloud-volume==12.14.4", "pyvista==0.49.0", "vtk==9.7.0"]
assets = ["trimesh==5.1.0"]
simulator = ["carla==0.9.16; python_version < '3.13'", "shapely==2.1.2; python_version < '3.13'", "networkx>=3.4,<4; python_version < '3.13'"]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
